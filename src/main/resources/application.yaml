server:
  port: 8080

spring:
  application:
    name: hotel-reservation-system
  profiles:
    active: dev

  # --- Verilənlər Bazası ---
  datasource:
    url: jdbc:postgresql://localhost:5432/hoteldb
    username: postgres
    password: ${DB_PASSWORD:52020278522}
    driver-class-name: org.postgresql.Driver

  # --- JPA/Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # --- Redis və Keşləmə ---
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
    cache:
      ttl-seconds: 3600
  cache:
    type: redis

  # --- Mail ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: elessar347@gmail.com
    password: ${MAIL_PASSWORD:gcdhrftkpkegyxxr}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5



# --- gRPC Konfiqurasiyası ---
grpc:
  server:
    port: 9091
    reflection-enabled: true
  client:
    cardService:
      address: 'static://localhost:9090'
      negotiation-type: plaintext

# --- Cloudflare R2 Storage ---
r2:
  endpointUrl: https://f2ec08a896de1580478f8983fa61f205.r2.cloudflarestorage.com
  bucketName: hotelreservationsystem
  accessKeyId: ${R2_ACCESS_KEY_ID:27d3e0122e329e25608993dd5cdd3475}
  secretAccessKey: ${R2_SECRET_ACCESS_KEY:0114e6c038994a6b43c9bef33d4352af4f441dfd2c1757b60c0418b49668bba9}

# --- Təhlükəsizlik (JWT) ---
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 3600000
    refresh-token:
      token-expiration: 604800000

# --- Loglama ---
logging:
  level:
    com.example.hotelreservationsystem: DEBUG
    org.springframework.web: DEBUG
    net.devh.boot.grpc: DEBUG # gRPC loglarını izləmək üçün
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


# --- Circuit Breaker ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      hotelReservationSystem:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50