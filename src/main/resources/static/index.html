<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Hotel Reservations</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0e27;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2d1b4e 100%);
        }

        .background-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                    radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                    radial-gradient(circle at 40% 20%, rgba(138, 180, 248, 0.3) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            margin-bottom: 60px;
            position: relative;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a8b2ff 50%, #ffd6e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease;
            letter-spacing: 2px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero p {
            font-size: 1.4em;
            color: #a8b2ff;
            font-weight: 300;
            letter-spacing: 1px;
            animation: fadeInUp 1s ease 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .glass-card:hover::before {
            left: 100%;
        }

        .glass-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 80px rgba(168, 178, 255, 0.2);
        }

        .auth-section {
            margin-bottom: 50px;
            animation: fadeInUp 1s ease 0.5s both;
        }

        .auth-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2em;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #a8b2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #a8b2ff;
            font-weight: 500;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #a8b2ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(168, 178, 255, 0.2);
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 15px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 71, 87, 0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ed573 0%, #7bed9f 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(46, 213, 115, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(46, 213, 115, 0.6);
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 1s ease 0.7s both;
        }

        .tab {
            padding: 18px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.4s;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
            position: relative;
            overflow: hidden;
        }

        .tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transform: translateX(-50%);
            transition: width 0.4s;
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-color: #667eea;
            color: #fff;
        }

        .tab.active::after {
            width: 100%;
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .content-section {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-section.active {
            display: block;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #a8b2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-bar input {
            flex: 1;
            min-width: 250px;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #a8b2ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(168, 178, 255, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: rgba(168, 178, 255, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #ffd6e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card p {
            color: rgba(255, 255, 255, 0.8);
            margin: 12px 0;
            line-height: 1.8;
            font-size: 0.95em;
        }

        .card p strong {
            color: #a8b2ff;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge.reserved {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .badge.available {
            background: linear-gradient(135deg, #2ed573 0%, #7bed9f 100%);
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
        }

        .card-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .card-actions .btn {
            flex: 1;
            padding: 12px;
            font-size: 0.9em;
        }

        .star-rating {
            color: #ffd700;
            font-size: 1.3em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        .alert {
            padding: 20px 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid;
            animation: slideInDown 0.5s ease;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(46, 213, 115, 0.2);
            border-color: rgba(46, 213, 115, 0.5);
            color: #7bed9f;
        }

        .alert-error {
            background: rgba(255, 71, 87, 0.2);
            border-color: rgba(255, 71, 87, 0.5);
            color: #ff6b81;
        }

        .alert-info {
            background: rgba(168, 178, 255, 0.2);
            border-color: rgba(168, 178, 255, 0.5);
            color: #a8b2ff;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #a8b2ff;
            font-size: 1.3em;
            font-weight: 300;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 31, 58, 0.95);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #a8b2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-content .form-group {
            margin-bottom: 25px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5em;
            }

            .hero p {
                font-size: 1.1em;
            }

            .auth-controls {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                justify-content: center;
            }

            .tab {
                padding: 15px 25px;
                font-size: 0.85em;
            }

            .glass-card {
                padding: 25px;
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .create-btn-container {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div class="background-animation"></div>
<div class="stars" id="stars"></div>

<div class="container">
    <div class="hero">
        <h1>✨ Luxury Hotels</h1>
        <p>Experience the finest accommodations worldwide</p>
    </div>

    <div class="auth-section glass-card">
        <h2>Member Access</h2>
        <div id="authMessage"></div>
        <div class="auth-controls">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="Enter password">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="authUsername" placeholder="Choose username">
            </div>
            <button class="btn btn-primary" onclick="login()"><span>Login</span></button>
            <button class="btn btn-secondary" onclick="register()"><span>Register</span></button>
            <button class="btn btn-danger" onclick="logout()"><span>Logout</span></button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('hotels')">Hotels</button>
        <button class="tab" onclick="switchTab('rooms')">Rooms</button>
        <button class="tab" onclick="switchTab('tickets')">My Bookings</button>
        <button class="tab" onclick="switchTab('card')">Payment</button>
        <button class="tab" onclick="switchTab('manage')">Manage</button>
    </div>

    <div id="hotels" class="content-section active">
        <div class="glass-card">
            <h2 class="section-title">Discover Hotels</h2>
            <div class="search-bar">
                <input type="text" id="hotelSearch" placeholder="Search hotels by name...">
                <button class="btn btn-primary" onclick="searchHotels()"><span>Search</span></button>
                <button class="btn btn-secondary" onclick="loadHotels()"><span>Show All</span></button>
            </div>
            <div id="hotelsList" class="grid"></div>
        </div>
    </div>

    <div id="rooms" class="content-section">
        <div class="glass-card">
            <h2 class="section-title">Explore Rooms</h2>
            <div class="search-bar">
                <input type="number" id="roomSearch" placeholder="Room number...">
                <button class="btn btn-primary" onclick="searchRooms()"><span>Search</span></button>
                <button class="btn btn-secondary" onclick="loadRooms()"><span>All Rooms</span></button>
                <button class="btn btn-secondary" onclick="loadUnreservedRooms()"><span>Available</span></button>
            </div>
            <div id="roomsList" class="grid"></div>
        </div>
    </div>

    <div id="tickets" class="content-section">
        <div class="glass-card">
            <h2 class="section-title">My Reservations</h2>
            <div class="search-bar">
                <input type="text" id="ticketUsername" placeholder="Enter your username...">
                <button class="btn btn-primary" onclick="loadUserTickets()"><span>Load Bookings</span></button>
            </div>
            <div id="ticketsList" class="grid"></div>
        </div>
    </div>

    <div id="card" class="content-section">
        <div class="glass-card">
            <h2 class="section-title">Payment Management</h2>
            <div class="create-btn-container">
                <button class="btn btn-success" onclick="openCreateCardModal()"><span>+ Create New Card</span></button>
            </div>
            <div id="cardInfo"></div>
            <div class="search-bar">
                <input type="number" id="cardIdInput" placeholder="Enter Card ID">
                <button class="btn btn-primary" onclick="loadCard()"><span>Load Card</span></button>
            </div>
        </div>
    </div>

    <div id="manage" class="content-section">
        <div class="glass-card">
            <h2 class="section-title">Admin Management</h2>
            <div class="create-btn-container">
                <button class="btn btn-success" onclick="openCreateHotelModal()"><span>+ Create Hotel</span></button>
                <button class="btn btn-success" onclick="openCreateRoomModal()"><span>+ Create Room</span></button>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div id="reserveModal" class="modal">
    <div class="modal-content">
        <h2>Reserve Your Stay</h2>
        <div class="form-group">
            <label>Card ID</label>
            <input type="number" id="reserveCardId">
        </div>
        <div class="form-group">
            <label>Cardholder Name</label>
            <input type="text" id="reserveCardHolder">
        </div>
        <div class="form-group">
            <label>Room Number</label>
            <input type="number" id="reserveRoomNumber" readonly>
        </div>
        <div class="form-group">
            <label>Check-in Date</label>
            <input type="datetime-local" id="reserveStartDate">
        </div>
        <div class="form-group">
            <label>Check-out Date</label>
            <input type="datetime-local" id="reserveEndDate">
        </div>
        <div class="form-group">
            <label>Email Confirmation</label>
            <input type="email" id="reserveEmail">
        </div>
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="confirmReservation()"><span>Confirm</span></button>
            <button class="btn btn-secondary" onclick="closeModal('reserveModal')"><span>Cancel</span></button>
        </div>
    </div>
</div>

<div id="ratingModal" class="modal">
    <div class="modal-content">
        <h2>Share Your Experience</h2>
        <div class="form-group">
            <label>Your Username</label>
            <input type="text" id="ratingUsername">
        </div>
        <div class="form-group">
            <label>Rating (1-5)</label>
            <input type="number" id="ratingValue" min="1" max="5" step="0.1">
        </div>
        <div class="form-group">
            <label>Your Review</label>
            <input type="text" id="ratingOpinion" placeholder="Share your thoughts...">
        </div>
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="submitRating()"><span>Submit</span></button>
            <button class="btn btn-secondary" onclick="closeModal('ratingModal')"><span>Cancel</span></button>
        </div>
    </div>
</div>

<div id="createCardModal" class="modal">
    <div class="modal-content">
        <h2>Create Payment Card</h2>
        <div class="form-group">
            <label>Card Number</label>
            <input type="number" id="newCardNumber" placeholder="123456789012">
        </div>
        <div class="form-group">
            <label>Cardholder Name</label>
            <input type="text" id="newCardHolderName" placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Expiration Date (MM/YY)</label>
            <input type="text" id="newCardExpiration" placeholder="12/25">
        </div>
        <div class="form-group">
            <label>CVV</label>
            <input type="number" id="newCardCVV" placeholder="123">
        </div>
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="createCard()"><span>Yarat</span></button>
            <button class="btn btn-secondary" onclick="closeModal('createCardModal')"><span>Ləğv et</span></button>
        </div>
    </div>
</div>
<script>
    const API_BASE = "http://localhost:8080/api/hotelReservationSystem";
    let authToken = localStorage.getItem('token') || null;

    async function apiFetch(endpoint, method = 'GET', body = null) {
        const headers = {
            'Content-Type': 'application/json',
            ...(authToken && { 'Authorization': `Bearer ${authToken}` })
        };
        const config = { method, headers };
        if (body) config.body = JSON.stringify(body);

        try {
            const response = await fetch(`${API_BASE}${endpoint}`, config);
            if (!response.ok) {
                const errorData = await response.text();
                throw new Error(errorData || `Status: ${response.status}`);
            }
            const contentType = response.headers.get("content-type");
            return (contentType && contentType.includes("application/json")) ? await response.json() : null;
        } catch (err) {
            console.error("API Error:", err.message);
            throw err;
        }
    }

    // --- AUTH ---
    async function login() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        try {
            const data = await apiFetch('/security/login', 'POST', { email, password });
            authToken = data.accessToken || data.token;
            localStorage.setItem('token', authToken);
            alert("Giriş uğurludur!");
            loadHotels();
        } catch (err) { alert("Xəta: " + err.message); }
    }

    async function register() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const username = document.getElementById('authUsername').value;
        try {
            await apiFetch('/security/register', 'POST', {
                email, password, firstName: username, lastName: "User"
            });
            alert("Qeydiyyat uğurludur! İndi giriş edə bilərsiniz.");
        } catch (err) { alert("Xəta: " + err.message); }
    }

    function logout() {
        localStorage.removeItem('token');
        location.reload();
    }

    // --- HOTEL & ROOM ---
    async function loadHotels() {
        const list = document.getElementById('hotelsList');
        list.innerHTML = '<div class="loading">Yüklənir...</div>';
        try {
            const hotels = await apiFetch('/hotel/getAllHotels');
            list.innerHTML = hotels.map(h => `
                <div class="card">
                    <h3>${h.hotelName}</h3>
                    <p>📍 ${h.hotelAddress}</p>
                    <div class="star-rating">${'★'.repeat(h.hotelStars || 5)}</div>
                    <button class="btn btn-primary" onclick="switchTab('rooms')"><span>Otaqlara Bax</span></button>
                </div>
            `).join('');
        } catch (err) { list.innerHTML = `<p class="alert-error">Xəta: ${err.message}</p>`; }
    }

    async function loadUnreservedRooms() {
        const list = document.getElementById('roomsList');
        list.innerHTML = '<div class="loading">Boş otaqlar axtarılır...</div>';
        try {
            const rooms = await apiFetch('/room/findUnreservedRooms');
            list.innerHTML = rooms.map(r => `
                <div class="card">
                    <h3>Otaq #${r.roomNumber}</h3>
                    <p>Qiymət: <strong>${r.price} AZN</strong></p>
                    <div class="badge available">Boşdur</div>
                    <button class="btn btn-success" onclick="openReserveModal(${r.roomNumber})"><span>Rezerv Et</span></button>
                </div>
            `).join('');
        } catch (err) { list.innerHTML = `<p class="alert-error">Xəta: ${err.message}</p>`; }
    }

    // --- MODALS ---
    function openCreateHotelModal() { document.getElementById('manage').scrollIntoView(); alert("Hotel yaratma paneli aktivdir."); }
    function openCreateRoomModal() { alert("Otaq yaratma paneli."); }
    function openCreateCardModal() { document.getElementById('createCardModal').classList.add('active'); }
    function openReserveModal(num) {
        document.getElementById('reserveRoomNumber').value = num;
        document.getElementById('reserveModal').classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // --- TABS ---
    function switchTab(tabId) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(event) event.currentTarget.classList.add('active');

        if(tabId === 'hotels') loadHotels();
        if(tabId === 'rooms') loadUnreservedRooms();
    }

    window.onload = loadHotels;
</script>
</body>
</html>
